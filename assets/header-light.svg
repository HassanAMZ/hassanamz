<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Shahzada Ali Hassan - closed-loop conversion tracking</title>
  <desc id="desc">A control loop: ad set, site, conversion, and server-side CAPI feeding the optimizer on a restricted domain.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#d8deea" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="18" fill="#f4f6fb"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)" opacity="0.7"/>
  <rect x="1" y="1" width="1198" height="358" rx="17" fill="none" stroke="#c5cddc" stroke-width="1.5"/>

  <rect x="1" y="1" width="1198" height="44" rx="17" fill="#eceff6"/>
  <rect x="1" y="28" width="1198" height="17" fill="#eceff6"/>
  <text x="28" y="29" fill="#5c6575" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="0.22em">CLOSED LOOP</text>
  <text x="188" y="29" fill="#1f42d0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="0.18em">CRISPER.IO</text>
  <circle cx="1074" cy="22" r="5.5" fill="#b86a2c"/>
  <text x="1090" y="27" fill="#b86a2c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="0.12em">RESTRICTED</text>
  <circle cx="958" cy="22" r="5.5" fill="#1f42d0">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="974" y="27" fill="#1f42d0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="0.12em">LIVE</text>

  <text x="36" y="112" fill="#5c6575" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="0.26em">FOUNDER  ·  NWPU CONTROL</text>
  <text x="36" y="168" fill="#12141a" font-family="Avenir Next, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="48" font-weight="700">Shahzada Ali Hassan</text>
  <text x="36" y="208" fill="#3d4554" font-family="Avenir Next, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22">Restricted-domain conversion tracking.</text>

  <text x="36" y="268" fill="#5c6575" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="0.16em">PIXEL</text>
  <text x="268" y="268" fill="#5c6575" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="0.16em">CAPI</text>
  <path d="M36 300 C70 300 78 320 110 300 C142 280 148 326 186 304 C214 288 220 300 248 300" fill="none" stroke="#b86a2c" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 8" opacity="0.9"/>
  <path d="M248 300 C290 300 300 282 340 282 C390 282 400 300 500 300" fill="none" stroke="#1f42d0" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="500" cy="300" r="5" fill="#1f42d0"/>

  <g transform="translate(560,58)">
    <path id="loop" d="M 90 48 H 424 C 486 48 524 86 524 148 V 176 C 524 238 486 276 424 276 H 90 C 28 276 -10 238 -10 176 V 148 C -10 86 28 48 90 48 Z" fill="none" stroke="#c5cddc" stroke-width="2"/>
    <path d="M 90 48 H 424 C 486 48 524 86 524 148 V 176 C 524 238 486 276 424 276 H 90 C 28 276 -10 238 -10 176 V 148 C -10 86 28 48 90 48 Z" fill="none" stroke="#1f42d0" stroke-width="2.5" stroke-dasharray="16 20" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="0;-144" dur="4.5s" repeatCount="indefinite"/>
    </path>
    <circle r="6" fill="#1f42d0">
      <animateMotion dur="4.5s" repeatCount="indefinite" rotate="auto">
        <mpath href="#loop"/>
      </animateMotion>
    </circle>
    <polygon points="300,41 322,48 300,55" fill="#1f42d0"/>
    <polygon points="517,148 524,170 531,148" fill="#1f42d0"/>
    <polygon points="224,269 202,276 224,283" fill="#1f42d0"/>
    <polygon points="-3,176 -10,154 4,176" fill="#1f42d0"/>
    <text x="257" y="154" text-anchor="middle" fill="#5c6575" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="0.2em">CONTROLLER</text>
    <text x="257" y="180" text-anchor="middle" fill="#12141a" font-family="Avenir Next, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600">Optimize</text>

    <rect x="18" y="22" width="148" height="52" rx="10" fill="#ffffff" stroke="#1f42d0" stroke-width="1.75"/>
    <text x="92" y="55" text-anchor="middle" fill="#12141a" font-family="Avenir Next, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600">Ad set</text>

    <rect x="348" y="22" width="148" height="52" rx="10" fill="#ffffff" stroke="#c5cddc" stroke-width="1.75"/>
    <text x="422" y="55" text-anchor="middle" fill="#12141a" font-family="Avenir Next, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600">Site</text>

    <rect x="348" y="250" width="148" height="52" rx="10" fill="#ffffff" stroke="#c5cddc" stroke-width="1.75"/>
    <text x="422" y="283" text-anchor="middle" fill="#12141a" font-family="Avenir Next, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600">Lead</text>

    <rect x="18" y="250" width="148" height="52" rx="10" fill="#ffffff" stroke="#1f42d0" stroke-width="1.75"/>
    <text x="92" y="283" text-anchor="middle" fill="#12141a" font-family="Avenir Next, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600">CAPI</text>
  </g>
</svg>
